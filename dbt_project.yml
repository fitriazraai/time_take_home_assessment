name: 'chicago_taxi_dbt'
version: '1.0.0'
config-version: 2

profile: 'chicago_taxi_bigquery'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  chicago_taxi_dbt:
    staging:
      +materialized: view
      +schema: staging
      chicago_taxi_trips:
        +description: "Staging models for official public Chicago taxi trip data."
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      taxi_trips:
        +description: "Intermediate transformations, derived trip metrics, and quality checks."
    marts:
      +materialized: table
      +schema: marts
      taxi_trips:
        +description: "Analytics-ready mart tables for BigQuery and Looker Studio."
